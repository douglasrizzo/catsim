[build-system]
# setuptools 77 is the first release that reads the SPDX `license` string below.
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Douglas De Rizzo Meneghetti", email = "douglasrizzo@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education :: Testing",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
keywords = [
    "computerized adaptive testing",
    "CAT",
    "item response theory",
    "IRT",
    "psychometrics",
    "simulation",
]
name = "catsim"
version = "0.21.0"
description = "Computerized adaptive testing toolkit"
# The CI test job's lowest-direct entries install exactly these floors.
# numpy: releases before 2.3.1 raise spurious matmul warnings when linked to Apple's Accelerate.
# scipy: 1.13 and 1.14 require numpy < 2.3, and 1.15's macOS wheels do not load on macOS 27.
dependencies = [
    "numpy>=2.3.1",
    "scipy>=1.16",
    "tqdm>=4.64",
    "typing-extensions>=4.4",
]
requires-python = ">=3.11"
readme = "README.md"
license = "BSD-3-Clause"

[project.optional-dependencies]
# matplotlib before 3.10.7 warns about deprecated pyparsing 3.3 names on import, which the tests
# turn into an error.
plot = ["matplotlib>=3.10.7"]  # catsim.plot, the only module that imports matplotlib

[project.urls]
Documentation = "https://douglasrizzo.com.br/catsim"
Source = "https://github.com/douglasrizzo/catsim"
Issues = "https://github.com/douglasrizzo/catsim/issues"
Changelog = "https://github.com/douglasrizzo/catsim/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
line-length = 120
indent-width = 2
preview = true

target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "D",
    "D417",  # every parameter documented; the numpy convention turns it off
    "DOC",
    "UP",
    "ANN",
    "B",
    "A",
    "BLE",
    "C4",
    "C90",  # McCabe complexity, at most 10 (lint.mccabe below)
    "EM",
    "ERA",
    "EXE",
    "FBT",  # a boolean flag is keyword-only, so a call reads flag=True rather than a bare True
    "G",
    "PIE",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TC",
    "ARG",
    "PTH",
    "PT",
    "FIX",  # bans TODO/FIXME/XXX/HACK comments outright, which leaves TD nothing to check
    "TID251",  # banned APIs only; TID252 would ban the package's relative imports
    "PD",
    "PLE",
    "PLW",
    "PLC",
    "PLR01",
    "PLR02",
    "PLR04",
    "PLR09",  # too many arguments (at most 6, 5 positional), locals, statements, branches or returns
    "PLR1",
    "PLR2",
    "PLR5",
    "PLR6",
    "TRY",
    "PGH",
    "FLY",
    "NPY",
    "PERF",
    "FURB",
    "S",
    "RUF",
    "T20",
]
ignore = [
  "D421",    # Google-style rule; numpy-style property docstrings here start with "Return ..."
  "DOC502",  # numpydoc lists the exceptions a function lets propagate from its callees
  "E111",
  "E114",
  "PLR0912",  # too many branches: C901 already bounds the branching
  "RUF105",  # Keep standard `# noqa` comments rather than migrating to `# ruff: ignore`
  "RUF201",  # Keep rule codes in this config rather than migrating to rule names
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# CatEngine.__init__ takes the bank, four strategies and the keyword-only exposure_control.
max-args = 6
max-positional-args = 5

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pydoclint]
# A one-line docstring has no sections to check.
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy.typing.NDArray".msg = "Use FloatArray or IntArray from catsim.typing; add an alias there for other dtypes."
"random".msg = "Take a numpy.random.Generator from the caller (ADR-0008); the global random module cannot be seeded per session."

[tool.ruff.lint.per-file-ignores]
"src/catsim/typing.py" = ["TID251"]  # the one place that defines the NDArray aliases
"notebooks/*" = ["T20"]  # tutorials print their results
"tests/*" = [
  "ANN",      # Test fixture wiring and local helpers do not need exhaustive annotations
  "ARG005",   # Mocked call signatures often intentionally ignore parameters
  "DOC",      # Test and fixture docstrings have no Returns or Raises sections
  "FBT",      # Test helpers and parametrized tests take booleans positionally
  "PLR0913",  # make_context takes each of StepContext's eight fields
  "PLC0415",  # Local imports in tests are acceptable when improving isolation
  "PLR6301",  # Test methods don't need to use self
  "PLR2004",  # Magic values are fine in tests - they're explicit test expectations
  "RUF069",   # Exact float expectations are acceptable in tests
  "S",        # Security rules are too noisy for intentionally non-production test code
  "TC001",    # Test-only type imports do not justify TYPE_CHECKING indirection
  "TC003",    # Test-only type imports do not justify TYPE_CHECKING indirection
]
# Every test has a docstring naming the behaviour it checks, or the bug that would make it fail (AGENTS.md):
# D102 and D103 stay on for tests, with no numpydoc sections, so the other pydocstyle rules are off.
"tests/test_*.py" = ["D100", "D101", "D104", "D105", "D106", "D107", "D2", "D3", "D4"]
# Fixtures, strategies and builders are not tests; a new helper module of tests/ joins this list.
"tests/{__init__,banks,conftest,contexts,hypothesis_strategies}.py" = ["D"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[dependency-groups]
dev = [
    "hypothesis>=6.127.0",
    "import-linter>=2.17",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",  # the plot extra: tests/test_plot.py and the notebooks
    "nbmake>=1.5.5",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
docs = [
    "matplotlib>=3.10.6",
    "myst-parser>=4.0.1",
    "numpydoc>=1.9.0",
    "sphinx>=8.1.3",
    "sphinxcontrib-bibtex>=2.6.3",
    "pydata-sphinx-theme>=0.16.0",
    "sphinxcontrib-mermaid>=2.1.1",
]

[tool.pytest.ini_options]
# The suite and the package's docstring examples.
testpaths = ["tests", "src/catsim"]
# importlib: the tests and the docstring examples both import the catsim that is installed. With the
# default mode, running the suite from an unpacked sdist imported src/catsim a second time beside the
# installed package and failed with "import file mismatch".
addopts = "--strict-markers --strict-config --doctest-modules --import-mode=importlib"
xfail_strict = true
filterwarnings = [
    "error",
    # Python 3.14 deprecates asyncio's event loop policies. nbmake 1.5.5 (the latest) sets one on
    # Windows while pytest loads plugins, so these warnings stopped every Windows test run before
    # collection. catsim never uses asyncio itself.
    "ignore:'asyncio.([A-Za-z]+EventLoopPolicy|[gs]et_event_loop_policy)' is deprecated:DeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["catsim"]

[tool.coverage.report]
# Input-validation raises stay measured, so an untested check shows up as missed.
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError"]
# Below the measured coverage while the 1.0 work deletes code and tests; raise it as tests for the
# uncovered input checks land.
fail_under = 88
show_missing = true

[tool.vulture]
# src and tests together: on its own, src's public API reads as unused.
paths = ["src/catsim", "tests"]
min_confidence = 60
ignore_decorators = ["@initialize", "@invariant", "@rule"]  # Hypothesis runs the state machines' rules
ignore_names = [
  "WEIGHTED_INFO",  # ClusterMethod member, chosen by its value "weighted_info"
  "_selector_cache",  # empty until the planned MPWI and MEPV selectors cache their tables in it
  "writeable",  # numpy's ndarray.flags.writeable, set to make arrays read-only
  "pytest_plugins",  # read by pytest
  "close_matplotlib_figures",  # autouse fixture
]

[tool.typos.files]
extend-exclude = ["*.svg"]  # generated figures; their path data reads as words

[tool.typos.default]
# The Portuguese title of Meneghetti (2015), cited on the cluster selector's page.
extend-ignore-re = ["(?i)selecao[ _]de[ _]itens"]

[tool.typos.default.extend-words]
lik = "lik"  # likelihood, in variable names
mis = "mis"  # maximum information stratification
nd = "nd"  # numpy's NDArray
sie = "sie"  # the surname Sie (Sie, Finkelman, Bartroff & Thompson), cited in the stopping specs
strat = "strat"  # stratified selectors: a-strat, MaxInfoStratSelector
thr = "thr"  # catR's nextItem argument for the test length, quoted on the progressive pages
writeable = "writeable"  # numpy's ndarray.flags.writeable

[tool.ty.src]
include = ["src/catsim", "tests"]

[tool.ty.rules]
# ty's default rules, plus the ones below. Left off: unsound-return and unsound-assignment (NumPy and
# SciPy stubs leak Any into return values).
possibly-unresolved-reference = "error"
missing-type-argument = "error"
blanket-ignore-comment = "error"
division-by-zero = "error"
possibly-missing-import = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
# A function tested for truth instead of called; both rules only warn by default.
redundant-condition = "error"
truthiness-test-of-callable = "error"
# Every override carries @override, so a base-class rename fails the check at each orphaned override.
missing-override-decorator = "error"

[tool.uv]
# soupsieve 4 (the first release without its ReDoS) needs Python >= 3.11.5. Resolving the lock
# for 3.11.0-3.11.4 as well would keep a vulnerable soupsieve 2.x in uv.lock for those patch
# releases. Published metadata still says >= 3.11; this only scopes the development lock.
environments = ["python_full_version >= '3.11.5'"]

# ---------------------------------------------------------------------------
# Pylint
# ---------------------------------------------------------------------------
[tool.pylint.messages-control]
# Only messages Ruff and ty lack. ty reports incompatible overrides, overridden finals and functions
# tested for truth; Ruff reports the slot, classmethod, except, finally, statement and dict-key checks.
enable = [
  "duplicate-code",
  "too-many-ancestors",
  "too-many-instance-attributes",
  "attribute-defined-outside-init",
  "super-init-not-called",
  "non-parent-init-called",
  "useless-parent-delegation",
  "unused-private-member",
  "bad-except-order",
  "cyclic-import",
  "redefined-outer-name",
]
disable = ["all"]

[tool.pylint.design]
max-parents = 7
max-attributes = 12

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-imports = true
ignore-docstrings = true
ignore-comments = true

# ---------------------------------------------------------------------------
# import-linter: the layering AGENTS.md describes, checked by `lint-imports`
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "catsim"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "catsim layers"
type = "layers"
containers = ["catsim"]
exhaustive = true  # every new top-level module must be placed in a layer
layers = [
  "plot",  # draws items and sessions; nothing in catsim imports it
  "simulation",
  "engine",
  "selection | estimation | initialization | stopping | exposure",  # "|": siblings that never import each other
  "state",
  "context",  # StepContext: below state and the strategies, which read it, and above the domain
  "metrics",
  "item_bank",
  "irt",
  "typing : exceptions",
]
ignore_imports = [
  # MEISelector runs one-step-ahead ability updates with an estimator.
  "catsim.selection.expected_info -> catsim.estimation.base",
  "catsim.selection.expected_info -> catsim.estimation.numerical",
  # MLWISelector weights information by the posterior over a quadrature grid under a flat prior.
  "catsim.selection.weighted_info -> catsim.estimation",
]

[[tool.importlinter.contracts]]
id = "no-runtime-in-domain"
name = "domain and strategies never import runtime objects"
type = "forbidden"
source_modules = [
  "catsim.irt",
  "catsim.item_bank",
  "catsim.metrics",
  "catsim.selection",
  "catsim.estimation",
  "catsim.initialization",
  "catsim.stopping",
  "catsim.exposure",
]
forbidden_modules = ["catsim.state", "catsim.engine", "catsim.simulation", "catsim.plot"]

[[tool.importlinter.contracts]]
id = "plot-only-matplotlib"
name = "only catsim.plot imports matplotlib"
type = "forbidden"
source_modules = [
  "catsim.typing",
  "catsim.exceptions",
  "catsim.irt",
  "catsim.item_bank",
  "catsim.metrics",
  "catsim.context",
  "catsim.state",
  "catsim.engine",
  "catsim.simulation",
  "catsim.selection",
  "catsim.estimation",
  "catsim.initialization",
  "catsim.stopping",
  "catsim.exposure",
]
forbidden_modules = ["matplotlib", "mpl_toolkits"]

[[tool.importlinter.contracts]]
id = "root-without-plot"
name = "importing catsim does not load catsim.plot or matplotlib"
type = "forbidden"
source_modules = ["catsim"]
forbidden_modules = ["catsim.plot", "matplotlib", "mpl_toolkits"]
as_packages = false  # the root __init__ alone; catsim.plot itself is a descendant of catsim
