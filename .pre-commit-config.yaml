# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # 1. Fast fail checks first
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: debug-statements

  # 2. Code structure modifications (before formatting)
  - repo: https://github.com/JelleZijlstra/autotyping
    rev: 24.9.0
    hooks:
      - id: autotyping
        stages: [pre-commit]
        types: [python]
        args: [--safe]

  # 3. File fixers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # 4. Linting and formatting
  - repo: local
    hooks:
      # Ruff runs from uv.lock, so these hooks and `uv run ruff` never disagree.
      - id: ruff-check
        name: ruff check
        entry: uv run --only-group dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty-check
        name: ty check
        entry: uv run --group dev ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pylint
        name: pylint
        entry: uv run --group dev pylint src/catsim
        language: system
        pass_filenames: false  # cyclic-import and duplicate-code need the whole package
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: pytest-nbmake
        name: pytest nbmake
        entry: env MPLBACKEND=Agg uv run --group dev pytest --nbmake --nbmake-timeout=300 -q
        language: system
        files: \.ipynb$
        types: [file]
        require_serial: true

  # 5. Other formatters
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args:
          - "--autofix"
        exclude: \.ipynb$
      - id: requirements-txt-fixer

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: ^sphinx/
        additional_dependencies:
          - mdformat-gfm
          - mdformat-toc
          - mdformat-footnote

  # 6. Validation checks last
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.12
    hooks:
      - id: uv-lock
        name: Check uv.lock is up to date

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.35.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
      - id: check-dependabot
