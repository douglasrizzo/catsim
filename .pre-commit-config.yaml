# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # 1. Fast fail checks first
  - repo: local
    hooks:
      # Catches `git add -f` past .gitignore too.
      - id: forbid-local-dirs
        name: local-only directories must not be committed
        entry: these paths are local-only (see AGENTS.md)
        language: fail
        files: ^(\.claude|\.plans|\.pre-commit-cache|papers)/
      # Tests mock only at boundaries (network, files, clocks, random draws), never catsim itself.
      # --multiline: a long call puts the target string on its own line.
      - id: no-patching-catsim
        name: tests patch only boundaries, not catsim internals
        entry: 'monkeypatch\.setattr\(\s*["'']catsim\.'
        language: pygrep
        args: [--multiline]
        files: ^tests/
      # sphinx/conf.py writes README.md from these sources; an edit to README.md alone is lost.
      - id: readme-generated
        name: README.md is generated from sphinx/readme_*.md
        entry: sh -c 'cat sphinx/readme_head.md sphinx/readme_body.md | cmp -s - README.md || { echo "README.md differs from sphinx/readme_head.md + sphinx/readme_body.md. Edit those, then regenerate it with cat sphinx/readme_head.md sphinx/readme_body.md > README.md"; exit 1; }'
        language: system
        pass_filenames: false
        files: ^(README\.md|sphinx/readme_(head|body)\.md)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]  # --enforce-all: CI runs --all-files, where nothing is newly added
      - id: check-merge-conflict
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: debug-statements

  # 2. Code structure modifications (before formatting)
  - repo: https://github.com/JelleZijlstra/autotyping
    rev: 24.9.0
    hooks:
      - id: autotyping
        stages: [pre-commit]
        types: [python]
        args: [--safe]

  # 3. File fixers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # 4. Linting and formatting
  - repo: local
    hooks:
      # Ruff runs from uv.lock, so these hooks and `uv run ruff` never disagree.
      - id: ruff-check
        name: ruff check
        entry: uv run --only-group dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty-check
        name: ty check
        entry: uv run --group dev ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pylint
        name: pylint
        entry: uv run --group dev pylint src/catsim
        language: system
        pass_filenames: false  # cyclic-import and duplicate-code need the whole package
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: import-linter
        name: import-linter
        entry: uv run --group dev lint-imports
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$
      - id: pytest-nbmake
        name: pytest nbmake
        entry: env MPLBACKEND=Agg uv run --group dev pytest --nbmake --nbmake-timeout=300 -q
        language: system
        files: \.ipynb$
        types: [file]
        require_serial: true

  # Dead code in src and tests; [tool.vulture] in pyproject.toml holds the paths and the whitelist.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        types_or: [python, toml]

  # Spelling; [tool.typos] in pyproject.toml holds the domain words.
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: [--force-exclude]  # report only: a rewrite of an identifier would break the code

  # 5. Other formatters
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args:
          - "--autofix"
        exclude: \.ipynb$
      - id: requirements-txt-fixer

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: ^(sphinx|specs|\.github)/|^README\.md$  # README.md is generated from sphinx/
        additional_dependencies:
          - mdformat-gfm
          - mdformat-toc
          - mdformat-footnote

  # 6. Validation checks last
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.12
    hooks:
      - id: uv-lock
        name: Check uv.lock is up to date

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
      - id: check-dependabot
