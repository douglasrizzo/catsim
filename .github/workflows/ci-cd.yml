name: CI/CD

on:
  pull_request:
  push:
    branches: [dev, main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  # The uv release every setup-uv step installs. Dependabot does not update it: bump it by hand.
  UV_VERSION: "0.13.9"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-uv's default enable-cache (auto) already skips the cache on release events.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # No pre-commit cache in the release run, which gates the PyPI upload. zizmor does not
      # evaluate step conditions, so it would still report this step.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'release' # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --only-group dev pre-commit run --all-files
        env:
          # The test job runs the notebooks; running them here too only doubles the time.
          SKIP: pytest-nbmake

  test:
    # Spelled out so the highest-resolution entries keep the check names the main branch ruleset requires.
    name: Run tests (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.resolution == 'lowest-direct' && ', lowest-direct' || '' }})
    # Run tests for every PR (stacked PRs too), pushes to dev/main, and releases.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Force a headless backend so plot tests don't depend on Tk/Tcl being available on runners.
      MPLBACKEND: Agg
      # uv would otherwise take the repository's .python-version (3.13) over setup-python's interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
      # An environment variable rather than a `uv sync` flag: `uv run` re-resolves a lock made with a
      # different resolution, which would replace the floors with the latest releases.
      UV_RESOLUTION: ${{ matrix.resolution }}
    strategy:
      fail-fast: false
      matrix:
        # Test on primary OS with all Python versions
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          # Add cross-platform testing on one Python only
          - os: macos-latest
            python-version: "3.14"
            resolution: highest
          - os: windows-latest
            python-version: "3.14"
            resolution: highest
          # Every direct dependency at the lower bound pyproject.toml declares, on the oldest Python,
          # so the floors stay ones CI has tested. macOS too: its numpy wheels link Apple's Accelerate
          # rather than OpenBLAS, so a floor that passes on Linux can fail there.
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
          - os: macos-latest
            python-version: "3.11"
            resolution: lowest-direct

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: matrix.resolution == 'highest'
        run: uv sync --locked --group dev

      # Not --locked: uv.lock holds the latest releases, and this entry resolves again to the floors.
      - name: Install dependencies at their lower bounds
        if: matrix.resolution == 'lowest-direct'
        run: |
          uv sync --group dev
          uv pip list

      - name: Run tests
        run: uv run pytest --verbose --cov-branch --cov-report=xml --cov=catsim

      - name: Run tutorial notebooks
        # RESCOPE: not on PRs into the rescope branch, whose notebooks are updated at the end. Revert
        # this commit before rescope merges into dev.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && github.base_ref != 'rescope'
        run: uv run pytest --nbmake --nbmake-timeout=300 notebooks/*.ipynb

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build package
    # Run builds for every PR (stacked PRs too), pushes to dev/main, and releases.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Add pre-release suffix for TestPyPI
        if: |
          github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Get current version from pyproject.toml
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          # Create release candidate version with PR number and run number
          NEW_VERSION="${CURRENT_VERSION}rc${GITHUB_RUN_NUMBER}"
          # Update pyproject.toml
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" pyproject.toml
          echo "Updated version to ${NEW_VERSION} for TestPyPI"
          echo "Original version: ${CURRENT_VERSION}"

      - name: Build package
        run: uv build

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          PROJECT_VERSION=$(uv version --short)
          WHEEL_VERSION=$(uv run --isolated --no-project --with dist/*.whl python -I -c 'import catsim; print(catsim.__version__)')
          echo "Release tag: $GITHUB_REF_NAME"
          echo "Project version (pyproject.toml): $PROJECT_VERSION"
          echo "catsim.__version__ in the built wheel: $WHEEL_VERSION"
          if [ "$GITHUB_REF_NAME" != "$PROJECT_VERSION" ] || [ "$GITHUB_REF_NAME" != "$WHEEL_VERSION" ]; then
            echo "::error::The release tag must equal both the project version and catsim.__version__"
            exit 1
          fi

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  test-wheel:
    name: Test the built wheel
    # Runs the suite against the wheel the publish jobs upload, installed into a clean environment,
    # so a packaging mistake (a missing module or data file) fails here instead of shipping.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the wheel into a clean environment
        run: |
          # Without the source tree, the only catsim the tests can import is the installed wheel.
          rm -rf src
          uv venv --python 3.11 "$RUNNER_TEMP/wheel-venv"
          # The plot extra: the tests import matplotlib.
          wheel=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/wheel-venv" "${wheel[0]}[plot]" pytest hypothesis

      - name: Run tests against the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import catsim; assert 'site-packages' in catsim.__file__, catsim.__file__"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -q -p no:cacheprovider

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [pre-commit, test, build, test-wheel, deploy-docs-production] # Wait for quality gates, the tested package, and live docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/catsim
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    # Publish to TestPyPI on the same-repository PR from dev to main (final checkpoint before release)
    if: |
      github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [pre-commit, test, build, test-wheel, deploy-docs-dev] # Wait for quality gates, the tested package, and live docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/catsim
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # The rc number is the run number, which a re-run keeps: skip what a failed attempt uploaded
          skip-existing: true

  build-docs:
    name: Build documentation
    # Build docs for every PR (stacked PRs too), pushes to dev/main, and releases
    # RESCOPE: not on PRs into the rescope branch, whose documentation is updated at the end. Revert
    # this commit before rescope merges into dev.
    if: |
      (github.event_name == 'pull_request' && github.base_ref != 'rescope') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build Sphinx documentation
        working-directory: sphinx
        # -W fails the build on any warning; --keep-going reports all of them before failing
        run: uv run sphinx-build -b html -W --keep-going . ../docs/build/html

      - name: Check for broken links
        run: |
          cd sphinx
          uv run sphinx-build -b linkcheck . ../docs/build/linkcheck
        continue-on-error: true # Don't fail the build on external link issues

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-docs-${{ github.sha }}
          path: docs/build/html/
          retention-days: 30

      - name: Add build info
        run: |
          {
            echo "📚 Documentation built successfully!"
            echo ""
            echo "**Build Details:**"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "Download the built documentation from the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs-dev:
    name: Deploy documentation (dev preview)
    # Deploy preview docs on pushes to dev, and on the same-repository PR from dev to main,
    # whose TestPyPI upload waits for this job in the same run (CONTRIBUTING.md, "Building the
    # documentation")
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [pre-commit, test, build, test-wheel, build-docs] # Docs go live only for a commit that passes every check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # One gh-pages push at a time. A queued deploy waits for the running one, but GitHub keeps only
      # one pending job per group: a third deploy cancels the pending one, which then skips the
      # publish that needs it. Recover with "Re-run failed jobs" on the cancelled run.
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: html-docs-${{ github.sha }}
          path: docs/build/html/

      - name: Deploy to GitHub Pages (dev subdirectory)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          destination_dir: dev # Deploy to /dev subdirectory
          commit_message: "Deploy dev documentation from ${{ github.sha }}"
          # With destination_dir set, peaceiris empties only dev/ first, so pages the current
          # docs no longer build disappear from the preview while the production docs at the
          # root stay.
          keep_files: false

      - name: Comment deployment URL
        run: |
          {
            echo "🚀 **Dev documentation deployed!**"
            echo ""
            echo "Preview at: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dev/"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs-production:
    name: Deploy documentation (production)
    # Deploy production docs on pushes to main, and on releases, whose PyPI upload waits for this
    # job in the same run (CONTRIBUTING.md, "Building the documentation")
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release'
    needs: [pre-commit, test, build, test-wheel, build-docs] # Docs go live only for a commit that passes every check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # One gh-pages push at a time. A queued deploy waits for the running one, but GitHub keeps only
      # one pending job per group: a third deploy cancels the pending one, which then skips the
      # publish that needs it. Recover with "Re-run failed jobs" on the cancelled run.
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: html-docs-${{ github.sha }}
          path: docs/build/html/

      - name: Check out the dev preview from gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-checkout
          sparse-checkout: dev
          persist-credentials: false

      - name: Carry the dev preview into the new site
        # The gh-pages concurrency group keeps a dev deploy from landing between this copy and the push.
        run: if [ -d gh-pages-checkout/dev ]; then cp -R gh-pages-checkout/dev docs/build/html/dev; fi

      - name: Deploy to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          commit_message: "Deploy production documentation from ${{ github.ref_name }}"
          # Replace the whole site, so pages the current docs no longer build disappear;
          # dev/ survives because the previous step copied it into publish_dir.
          keep_files: false

      - name: Comment deployment URL
        run: |
          {
            echo "🎉 **Production documentation deployed!**"
            echo ""
            echo "Live at: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Sign and upload to GitHub Release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release'
    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign the dists with Sigstore and attach them to the release
        # On a published release the action uploads the dists and their .sigstore.json bundles
        # to it (release-signing-artifacts defaults to true).
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
